# Demo fuzzing run for examples/csvsplit (review #9 order 3; green since review #20): fuzz the CSV
# splitter for at most 120 s, upload any crash inputs as artifact `crashes`, report them in the job
# summary and finish green; leakproof-fix.yml then picks the inputs up. Manual only.
# (examples/github-action/ keeps the realistic variant where a project's fuzz job fails on a crash.)
name: demo-fuzz

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the fuzzer (clang, libFuzzer + ASan)
        working-directory: examples/csvsplit
        run: make csvsplit_fuzz CC=clang CFLAGS="-g -O1 -fsanitize=address,undefined,fuzzer-no-link"

      - name: Fuzz for at most 120 s
        id: fuzz
        working-directory: examples/csvsplit
        run: |
          mkdir -p ../../crashes work
          cp corpus/* work/
          set +e
          ./csvsplit_fuzz -max_total_time=120 -artifact_prefix=../../crashes/ work 2>&1 | tail -40
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          ls -l ../../crashes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashes
          path: crashes/
          if-no-files-found: ignore

      - name: Report (green either way; leakproof-fix takes over)
        run: |
          n=$(ls -A crashes 2>/dev/null | wc -l)
          if [ "$n" -gt 0 ]; then
            echo "::notice::libFuzzer found $n crash input(s) in csvsplit; handed to leakproof-fix."
            echo "### demo-fuzz: found $n crash input(s) in csvsplit" >> "$GITHUB_STEP_SUMMARY"
            echo "Uploaded as artifact \`crashes\`; the **leakproof-fix** workflow starts automatically and tries to fix the first one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no crash in 120 s" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
