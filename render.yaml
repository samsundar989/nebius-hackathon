# Render Blueprint (Samuel: New -> Blueprint -> this repo). Two services:
#  1. leakproof-dashboard: static site from site/ (data pre-generated by scripts/build_site.py)
#  2. leakproof-demo: the "run one Juliet case" service (sandboxed live runner, D-0061). Ships
#     with live runs OFF (DEMO_ENABLED=false; flip it in the Render dashboard) and serves
#     labelled recorded results until then; secrets are prompted once, at Blueprint creation.
#     Live runs need DEMO_PASSCODE (in Devpost's testing instructions); POST /reverify (the
#     gate on a stored patch, no model call) works with live runs off.
services:
  - type: web
    name: leakproof-dashboard
    runtime: static
    buildCommand: echo "site/ is pre-built by scripts/build_site.py"
    staticPublishPath: ./site
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  - type: web
    name: leakproof-demo
    runtime: docker
    plan: free
    dockerfilePath: ./service/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_PROJECT_ID
        sync: false
      - key: DEMO_ENABLED
        value: "false"
      - key: DEMO_MAX_RUNS_PER_DAY
        value: "25"
      - key: DEMO_MAX_RUNS_PER_IP_10MIN
        value: "3"
      - key: DEMO_PASSCODE
        sync: false
      - key: DEMO_TOTAL_USD
        value: "3.00"
      - key: DEMO_DAILY_USD
        value: "0.50"
      - key: LEAKPROOF_BUDGET_USD
        value: "3.00"
      - key: SITE_ORIGIN
        value: "*"
