# gpac/gpac issue #4006 (opened 2026-10-17): heap-buffer-overflow READ in gf_fopen_ex/DoWriteMeta
# on an unterminated meta item full_path (src/isomedia/meta.c). Upstream source in ../src (shallow
# clone of master, not committed). PoC and DRM config are the issue's attachment (poc.zip,
# SHA256SUMS checked). The models never see the issue text.
[project]
name = "gpac_4006"
src = "../src"
image = "leakproof/cpp-sanitizers:zlib"  # images/cpp-sanitizers-zlib: configure requires zlib
build = '''( set -e
# Windows checkouts lose the executable bit.
grep -rlI --exclude-dir=.git '^#!' . | xargs -r chmod +x
# ASan builds: clang does not link the sanitizer runtime into a shared library, so drop -z defs.
[ -f config.mak ] || sed -i "s/ -Wl,-z,defs//" configure
[ -f config.mak ] || ./configure --cc=clang --enable-sanitizer --extra-cflags="-g -O0 -fno-omit-frame-pointer" --extra-ldflags="-fsanitize=address,undefined" > /tmp/configure.log 2>&1 || { tail -30 /tmp/configure.log; exit 1; }
make -j8 > /tmp/make.log 2>&1 || { grep -E 'error' /tmp/make.log | head -30; tail -20 /tmp/make.log; exit 1; }
)'''
# The issue's command; the CENC AES-CTR config is written next to the input (261 bytes).
reproduce = '''printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<GPACDRM type="CENC AES-CTR">' ' <DRMInfo type="pssh" version="1">' '  <BS ID128="0x11223344556677889900112233445566"/>' ' </DRMInfo>' ' <CI>' '  <IPMP>' '   <K ID128="0x00112233445566778899aabbccddeeff"/>' '  </IPMP>' ' </CI>' '</GPACDRM>' > /tmp/drm_ctr.xml && cp /tmp/poc /tmp/poc.mp4 && ./bin/gcc/MP4Box -decrypt /tmp/drm_ctr.xml /tmp/poc.mp4 -out /tmp/out.mp4'''
poc = "../4006/poc.mp4"
# No project tests: `make unit_tests` ran nothing in a 1 s probe (the harness needs
# `configure --unittests`), and the testsuite submodule is not cloned. The gate judges the
# reproducer and the inputs it generates from the PoC; evidence is weak by its own definition.
editable = ["src/isomedia/*.c", "src/filters/mux_isom.c", "src/utils/os_file.c"]
