# assimp/assimp issue #6945 (opened 2026-10-14): LeakSanitizer leak in STLImporter::LoadASCIIFile
# when an ASCII STL fails to parse part-way. Upstream source in ../src (shallow clone of master,
# not committed). The reproducer is the issue's own program and input; the models never see the
# issue text (it contains a suggested fix).
[project]
name = "assimp_6945"
src = "../src"
# A shared library without the tools/samples; the unit tests (gtest) are on. Empty build type: no
# "d" suffix, and $CFLAGS/$CXXFLAGS (ASan + UBSan, -g -O0) are the only flags.
build = '''( set -e
cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DASSIMP_BUILD_TESTS=ON -DASSIMP_BUILD_ASSIMP_TOOLS=OFF -DASSIMP_BUILD_SAMPLES=OFF -DASSIMP_WARNINGS_AS_ERRORS=OFF -DASSIMP_INSTALL=OFF -DASSIMP_BUILD_ZLIB=ON > /tmp/cmake.log 2>&1 || { tail -30 /tmp/cmake.log; exit 1; }
cmake --build build -j8
cat > /tmp/read.cpp <<'EOF'
#include <assimp/Importer.hpp>
#include <assimp/scene.h>
#include <cstdio>
int main(int argc, char **argv) {
    Assimp::Importer imp;
    const aiScene *s = imp.ReadFile(argv[1], 0);
    printf("%s\n", s ? "scene" : imp.GetErrorString());
}
EOF
$CXX $CXXFLAGS -Iinclude -Ibuild/include /tmp/read.cpp -Lbuild/bin -Lbuild/lib -lassimp -Wl,-rpath,$PWD/build/bin:$PWD/build/lib $LDFLAGS -o build/read_stl
)'''
# assimp picks the importer by extension.
reproduce = '''cp /tmp/poc /tmp/poc.stl && ./build/read_stl /tmp/poc.stl'''
poc = "../6945/poc.stl"
test = '''"$(ls build/bin/unit build/unit 2>/dev/null | head -1)"'''
editable = ["code/AssetLib/STL/*.cpp", "code/AssetLib/STL/*.h", "code/Common/*.cpp"]
