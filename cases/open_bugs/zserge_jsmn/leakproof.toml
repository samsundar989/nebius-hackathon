# zserge/jsmn issue #249: out-of-bounds read in example/jsondump.c on a malformed non-strict input.
# Upstream source in ./src (not committed); poc.json is generated by the issue's inline make_poc.py.
[project]
name = "jsmn_249"
src = "."
build = '''clang $CFLAGS -Isrc -o jsondump src/example/jsondump.c'''
reproduce = '''./jsondump < /tmp/poc > /dev/null'''
test = '''make -C src test'''
poc = "poc.json"
artifact = "jsondump"
editable = ["src/jsmn.h", "src/example/*.c"]
