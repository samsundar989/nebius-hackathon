# landley/toybox issue #572: heap-buffer-overflow in patch (KLEE-found). Upstream source in ../src
# (shallow clone shared by the three toybox cases, not committed; see ../notes.md).
[project]
name = "toybox_572"
src = "../src"
build = '''chmod +x scripts/*.sh scripts/*/*.sh 2>/dev/null; make defconfig > /dev/null && make -j4 toybox'''
# `|| true`: on this malformed patch a fixed `patch` reports an error and exits 1; the gate judges
# the sanitizer report, so a crash still fails the check.
reproduce = '''./generated/unstripped/toybox patch < /tmp/poc || true'''
poc = "../572/poc.patch"
# toybox's own tests for this command (tests/patch.test), offline; VERBOSE=all runs every test
# instead of stopping at the first failure. Built with ASan only: UBSan reports a pre-existing issue
# (lib/xwrap.c:428) into the output of 12 of the 13 tests, which hides what they check.
test = '''CFLAGS="-fsanitize=address -g -O0" LDFLAGS="-fsanitize=address" VERBOSE=all bash scripts/test.sh patch'''
# Hashed by the gate to prove each candidate was compiled into the binary under test.
artifact = "generated/unstripped/toybox"
editable = ["toys/*/*.c", "lib/*.c", "lib/*.h"]
