# berry-lang/berry issue #544 (format path): string.format overflows its fixed format buffer on
# an over-long conversion specifier. Upstream source in ../src (not committed).
[project]
name = "berry_544_format"
src = "../src"
build = '''chmod +x tools/coc/coc && make CC=clang CFLAGS="$CFLAGS -std=c99" LFLAGS="$LDFLAGS" LIBS="-lm -ldl" -j4'''
reproduce = '''./berry /tmp/poc'''
test = '''ASAN_OPTIONS=detect_leaks=0 ./berry testall.be'''
poc = "../544_format/poc.be"
editable = ["src/*.c", "src/*.h"]
