<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
  <title>Leakproof architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <!-- finding -->
  <rect x="12" y="250" width="150" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="87" y="282" text-anchor="middle" font-weight="600">Finding</text>
  <text x="87" y="304" text-anchor="middle" font-size="13">sanitizer report</text>
  <text x="87" y="322" text-anchor="middle" font-size="13">+ crash input</text>
  <!-- baseline -->
  <rect x="190" y="250" width="160" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="270" y="282" text-anchor="middle" font-weight="600">Baseline</text>
  <text x="270" y="304" text-anchor="middle" font-size="13">build + reproduce</text>
  <text x="270" y="322" text-anchor="middle" font-size="13">checkpoint image</text>
  <!-- planner -->
  <rect x="380" y="110" width="210" height="90" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="485" y="142" text-anchor="middle" font-weight="600">Nemotron 3 Ultra</text>
  <text x="485" y="164" text-anchor="middle" font-size="13">root cause +</text>
  <text x="485" y="182" text-anchor="middle" font-size="13">up to 4 fix hypotheses</text>
  <!-- workers -->
  <rect x="380" y="240" width="210" height="130" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="485" y="270" text-anchor="middle" font-weight="600">4 × Nemotron 3.5 Lightning</text>
  <text x="485" y="294" text-anchor="middle" font-size="13">one branch of the checkpoint each</text>
  <text x="485" y="312" text-anchor="middle" font-size="13">sees finding, plan, editable files</text>
  <text x="485" y="330" text-anchor="middle" font-size="13">never the gate, tests or dev fix</text>
  <text x="485" y="354" text-anchor="middle" font-size="12" fill="#6b7280">Nebius Token Factory</text>
  <!-- adversary -->
  <rect x="596" y="10" width="278" height="84" rx="8" fill="#fdf4ff" stroke="#a21caf"/>
  <text x="735" y="42" text-anchor="middle" font-weight="600">Adversary: Nemotron 3 Super</text>
  <text x="735" y="62" text-anchor="middle" font-size="13">proposes inputs against one candidate;</text>
  <text x="735" y="79" text-anchor="middle" font-size="12">only a sanitizer report or output difference rejects</text>
  <!-- gate -->
  <rect x="620" y="120" width="230" height="330" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="735" y="148" text-anchor="middle" font-weight="600">Evidence gate</text>
  <text x="735" y="167" text-anchor="middle" font-size="12" fill="#2563eb">own process · network off</text>
  <text x="636" y="194" font-size="13">diff scope · build · compiled</text>
  <text x="636" y="214" font-size="13">PoC clean · project tests</text>
  <text x="636" y="234" font-size="13">behaviour · differential corpus</text>
  <text x="636" y="254" font-size="13">re-fuzz · LeakSanitizer safe-fix</text>
  <text x="636" y="284" font-size="13" font-weight="600">inputs it runs:</text>
  <text x="636" y="304" font-size="13">fuzz corpus · amplified PoC</text>
  <text x="636" y="324" font-size="13">generated inputs (no harness)</text>
  <text x="636" y="344" font-size="13">adversary inputs</text>
  <text x="636" y="372" font-size="13">ASan + UBSan + LSan decide;</text>
  <text x="636" y="390" font-size="13">a model never rejects on its own</text>
  <text x="636" y="418" font-size="12" fill="#6b7280">Docker or Nebius Sandboxes</text>
  <text x="636" y="436" font-size="12" fill="#6b7280">reference: developer fix (calibration)</text>
  <!-- outcomes -->
  <rect x="868" y="150" width="84" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="910" y="187" text-anchor="middle" font-weight="600">verified</text>
  <text x="910" y="232" text-anchor="middle" font-size="12">no tests ran →</text>
  <text x="910" y="248" text-anchor="middle" font-size="12">human review</text>
  <rect x="868" y="330" width="84" height="64" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="910" y="359" text-anchor="middle" font-weight="600">refused</text>
  <text x="910" y="379" text-anchor="middle" font-size="12">+ reason</text>
  <!-- repair -->
  <rect x="380" y="480" width="320" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="540" y="512" text-anchor="middle" font-weight="600">Repair round (optional, once)</text>
  <text x="540" y="536" text-anchor="middle" font-size="13">Ultra sees each attempt's diff + failure kind and stack</text>
  <!-- arrows -->
  <path d="M162 295H188" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M350 275L378 160" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M485 200V238" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M350 305H378" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M590 305H618" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M735 92V118" stroke="#a21caf" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M850 200L866 190" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M850 350L866 358" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M735 450V520H702" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <path d="M380 520H176V130H378" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
</svg>
